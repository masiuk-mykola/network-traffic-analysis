[project]
name = "capture-api"
version = "1.0.0"
description = "Deterministic network-traffic simulator with a forensics API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Fernhollow Systems" }]
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "tzdata>=2025.2",
]

[project.scripts]
capture-api = "capture_api.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "mypy>=1.18",
    "httpx>=0.28.1",
    "httpx2>=2.13.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "capture_api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "S", "PL", "TRY", "PERF", "FURB", "PT", "ARG",
    "PTH", "DTZ", "RUF", "C4", "RET",
]
ignore = ["S311", "PLR0913", "PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["capture_api"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    # starlette.testclient still references anyio's deprecated BlockingPortal alias at import.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
